name: kana-kanji-pairs
description: |
  Two-step kana-kanji pair generation from OCR TSV.
  Step 1: LLM merges OCR fragments into bunsetsu-segmented sentences.
  Step 2: LLM converts bunsetsu text to hiragana readings.
  A page whose step 1 or step 2 fails is skipped.

  Parameters (set with -P key=value):
    ocrFile   - path to input OCR TSV file
    pairsFile - path to output pairs TSV file
    vllmUrl   - OpenAI-compatible chat completions URL of the local LLM,
                e.g. http://host:8000/v1/chat/completions
    vllmModel - model name served at vllmUrl

params:
  ocrFile:
    description: path to input OCR TSV file
  pairsFile:
    description: path to output pairs TSV file
  vllmUrl:
    description: OpenAI-compatible chat completions URL of the local LLM
  vllmModel:
    description: model name served at vllmUrl

steps:
  # ── Setup ─────────────────────────────────────────────────────────────────

  - states: ["0", "1"]
    label: load-plugin
    actions:
      - actor: loader
        method: loadJar
        arguments: "com.scivicslab.turingworkflow.plugins:plugin-kana-kanji:@project.version@"

  - states: ["1", "2"]
    label: create-actors
    actions:
      - actor: loader
        method: createChild
        arguments: ["ROOT", "vllm", "com.scivicslab.turingworkflow.plugins.kanakanji.VllmActor"]
      - actor: loader
        method: createChild
        arguments: ["ROOT", "ocr", "com.scivicslab.turingworkflow.plugins.kanakanji.OcrActor"]
      - actor: loader
        method: createChild
        arguments: ["ROOT", "pairs", "com.scivicslab.turingworkflow.plugins.kanakanji.PairsActor"]

  - states: ["2", "3"]
    label: configure
    actions:
      - actor: vllm
        method: setUrl
        arguments: {url: "jexl: state.getString('vllmUrl')"}
      - actor: vllm
        method: setModel
        arguments: {model: "jexl: state.getString('vllmModel')"}
      - actor: ocr
        method: loadFile
        arguments: {path: "jexl: state.getString('ocrFile')"}
      - actor: pairs
        method: openOutput
        arguments: {path: "jexl: state.getString('pairsFile')"}

  # ── Page loop ─────────────────────────────────────────────────────────────

  # Try to advance to next page; fails → all done
  - states: ["3", "4"]
    label: next-page
    actions:
      - actor: ocr
        method: nextPage

  # All pages processed → close and end
  - states: ["3", "end"]
    label: all-done
    actions:
      - actor: pairs
        method: closeOutput
      - actor: log
        method: add
        arguments: {source: "kana-kanji", type: "stdout", data: "All pages processed."}

  # ── Step 1: Bunsetsu segmentation ─────────────────────────────────────────

  - states: ["4", "5"]
    label: get-page-text
    actions:
      - actor: ocr
        method: getPageText

  - states: ["5", "6"]
    label: step1-segment
    note: Send OCR text to LLM for bunsetsu segmentation; save result as 'segmented'
    actions:
      - actor: vllm
        method: segment
        arguments: {text: "jexl: result"}
      - actor: interpreter
        method: putJson
        arguments: {path: segmented, value: "jexl: result"}

  # Step 1 failed (LLM error) → skip page, go to next
  - states: ["5", "3"]
    label: step1-failed-skip
    actions:
      - actor: log
        method: add
        arguments: {source: "kana-kanji", type: "stderr", data: "Step 1 failed, skipping page"}

  # ── Step 2: Hiragana conversion ───────────────────────────────────────────

  - states: ["6", "7"]
    label: get-page-info
    actions:
      - actor: ocr
        method: getPageInfo

  - states: ["7", "8"]
    label: set-pairs-page-info
    actions:
      - actor: pairs
        method: setPageInfo
        arguments: {pageInfo: "jexl: result"}

  # Step 2: toHiragana handles batching (20 lines) and per-line retry internally.
  # Writes pairs on success; on failure goes to next page.
  - states: ["8", "3"]
    label: step2-to-hiragana-and-write
    note: Convert segmented text to hiragana (batched, with per-line retry), then write pairs
    actions:
      - actor: vllm
        method: toHiragana
        arguments: {text: "jexl: state.getString('segmented')"}
      - actor: pairs
        method: writePairs
        arguments: {response: "jexl: result"}

  # Step 2 failed entirely → skip page
  - states: ["8", "3"]
    label: step2-failed-skip
    actions:
      - actor: log
        method: add
        arguments: {source: "kana-kanji", type: "stderr", data: "Step 2 failed, skipping page"}

  # ── Error fallback ────────────────────────────────────────────────────────

  - states: ["!end", "end"]
    label: catch-all
    actions:
      - actor: pairs
        method: closeOutput
      - actor: log
        method: add
        arguments: {source: "kana-kanji", type: "stderr", data: "Workflow ended unexpectedly"}

name: llm-hello
description: |
  Load the LLM plugin from the local Maven repository and send one prompt to an
  OpenAI-compatible chat completions endpoint.

  Parameters (set with -P key=value):
    llmUrl   - the URL requests are posted to, e.g. http://host:8000/v1/chat/completions
    llmModel - model name served at llmUrl

params:
  llmUrl:
    description: the URL requests are posted to, e.g. http://host:8000/v1/chat/completions
  llmModel:
    description: model name served at llmUrl

steps:
  - states: ["0", "1"]
    label: load-jar
    note: Load LLM plugin JAR from local Maven repository
    actions:
      - actor: loader
        method: loadJar
        arguments: "com.scivicslab.turingworkflow.plugins:plugin-llm:@project.version@"

  - states: ["1", "2"]
    label: create-llm-actor
    note: Create llm actor under workflow root
    actions:
      - actor: loader
        method: createChild
        arguments:
          - ROOT
          - llm
          - com.scivicslab.turingworkflow.plugins.llm.LlmActor

  - states: ["2", "3"]
    label: set-endpoint
    note: Point the llm actor to the OpenAI-compatible endpoint
    actions:
      - actor: llm
        method: setOpenAiUrl
        arguments:
          url: "jexl: state.getString('llmUrl')"
          model: "jexl: state.getString('llmModel')"

  - states: ["3", "4"]
    label: send-prompt
    note: Send a simple prompt and keep the reply as the result
    actions:
      - actor: llm
        method: callOpenAi
        arguments:
          prompt: "Hello! Please respond with a short greeting and tell me what you can do."

  - states: ["4", "end"]
    label: done
    note: Print the reply
    actions:
      - actor: interpreter
        method: print
        arguments: "jexl: result"

  - states: ["!end", "end"]
    label: catch-all
    note: Prevent infinite loop
    actions:
      - actor: interpreter
        method: print
        arguments: "llm-hello: a step failed - forcing end"
